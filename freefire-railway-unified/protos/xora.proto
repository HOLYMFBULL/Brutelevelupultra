syntax = "proto3";

package ff.xora;

message TeamMemberSync {
  int64 account_id = 1;
  bool is_ready = 2;
  string role = 3;
  int32 ping = 4;
}

message SquadSyncPacket {
  string squad_id = 1;
  int64 leader_account_id = 2;
  int32 current_slots = 3;
  int32 max_slots = 4;
  repeated TeamMemberSync members = 5;
  int64 sync_timestamp = 6;
}
